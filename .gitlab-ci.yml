stages:
  - build
  - run
  - disableDomain
  - enableDomain
  - createDomain
  - controlGroup
variables:
  createdomainname:

before_script:
  - export PATH=$PATH:/usr/local/go/bin
  - go version
  - go env
  - export GO111MODULE=on

build:
  stage: build
  script:
    - cd getDomainId/basic/
    - go mod tidy
    - go build -v ./...
  
run:
  stage: run
  script:
    - cd getDomainId/basic/
    - pwd
    - go run Client.go 
    - DomainID=$(go run Client.go 2>&1 | grep domainidresult |awk '{print $2}')  # 提取并存储DomainID
    - echo $DomainID
    - echo $DomainID > domainid.txt
  artifacts:
    paths:
      - getDomainId/basic/domainid.txt
  only:
    variables:
      - $setdomainname
    
disableDomain:
  stage: disableDomain
  script:
    - pwd
    - ls -l getDomainId/basic/domainid.txt
    - cp getDomainId/basic/domainid.txt .
    - ls -l domainid.txt
    - DomainID=$(cat domainid.txt)
    - cd disableDomain/basic/
    - go run Client.go $DomainID
  only:
    variables:
      - $disable == "true"

enableDomain:
  stage: enableDomain
  script:
    - pwd
    - ls -l getDomainId/basic/domainid.txt
    - cp getDomainId/basic/domainid.txt .
    - ls -l domainid.txt
    - DomainID=$(cat domainid.txt)
    - cd enableDomain/basic/
    - go run Client.go $DomainID
  only:
    variables:
      - $enable == "true"
createDomain:
  stage: createDomain
  script:
    - cd createDomain/basic
    - go run Client.go
    - sleep 10
    - cd ../../controlGroup/basic
    - go run Client.go
  only:
    variables:
      - $createdomainname
