stages:
  - build
  - run
  # - disableDomain
variables:
  targetDomainName : autotest.rpgp.cc

before_script:
  - export PATH=$PATH:/usr/local/go/bin
  - go version
  - go env
  - export GO111MODULE=on

build:
  stage: build
  script:
    - cd getDomainId/basic/
    - go mod tidy
    - go build -v ./...

run:
  stage: run
  script:
    - cd getDomainId/basic/
    - DomainID=$(go run Client.go 2>&1 | grep 'DomainID' )  # 提取并存储DomainID
    - echo $DomainID
