stages:
  - build
  - run
  - disableDomain
  # - disableDomain
variables:
  targetDomainName : autotest.rpgp.cc

before_script:
  - export PATH=$PATH:/usr/local/go/bin
  - go version
  - go env
  - export GO111MODULE=on

build:
  stage: build
  script:
    - cd getDomainId/basic/
    - go mod tidy
    - go build -v ./...

run:
  stage: run
  script:
    - cd getDomainId/basic/
    - DomainID=$(go run Client.go 2>&1 | grep 'domainidresult' |awk '{print $2}')  # 提取并存储DomainID
    - echo $DomainID > ../../domainid.txt
    - cd
    - cat domainid.txt
disableDomain:
  stage: disableDomain
  script:
    - cd disableDomain/basic/
    - DomainID=$(cat ../../domainid.txt)
    - go run Client.go $DomainID