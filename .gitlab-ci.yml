stages:
  - build
  - run
  - disableDomain
variables:
  targetDomainName : autotest.rpgp.cc

before_script:
  - export PATH=$PATH:/usr/local/go/bin
  - go version
  - go env
  - export GO111MODULE=on

build:
  stage: build
  script:
    - go mod tidy
    - go build -v ./...

run:
  stage: run
  script:
    - cd getDomainId/basic/
    - go run Client.go > ../../domainid.txt 
    - cat ../../domainid.txt 
